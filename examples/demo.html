<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>livehtml demo</title>
<meta name="livehtml-room" content="demo">
<style>
  body { font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         max-width: 720px; margin: 40px auto; padding: 0 24px; color: #222; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; color: #374151; }
  .hint { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 18px; margin: 10px 0; background: #fafafa; }
  label { display: block; margin: 6px 0; }
  input[type=text], textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font: inherit; box-sizing: border-box; background: #fff; }
  textarea { min-height: 80px; resize: vertical; }
  input[type=range] { width: 200px; vertical-align: middle; }
  details { padding: 10px 14px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; margin: 8px 0; }
  details summary { cursor: pointer; font-weight: 500; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  code { background: #f4f4f5; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>

<h1>livehtml demo</h1>
<p class="hint">在两个浏览器/窗口里打开同一个 URL，状态会实时同步。点击右上角小圆点查看在线用户。</p>

<h2>1. Checkbox 任务清单</h2>
<div class="card">
  <label><input type="checkbox" data-live="task-1"> 写一个 demo</label>
  <label><input type="checkbox" data-live="task-2"> 在两个浏览器里打开</label>
  <label><input type="checkbox" data-live="task-3"> 互相勾选试试</label>
  <label><input type="checkbox" data-live="task-4"> 关掉再打开看看是否保留</label>
</div>

<h2>2. 文本备注</h2>
<div class="card">
  <label>标题 <input type="text" data-live="title" placeholder="给这个 demo 起个名字"></label>
  <label>详细备注 <textarea data-live="note" placeholder="多人协作时，文本字段只在没人编辑时才会被远端覆盖"></textarea></label>
</div>

<h2>3. 选择 / 数值</h2>
<div class="card">
  <div class="row">
    <label>状态
      <select data-live="status">
        <option value="">未开始</option>
        <option value="doing">进行中</option>
        <option value="blocked">阻塞</option>
        <option value="done">完成</option>
      </select>
    </label>
    <label>评分 <input type="number" data-live="score" min="0" max="100" style="width:80px"></label>
    <label>进度 <input type="range" data-live="progress" min="0" max="100"></label>
  </div>
</div>

<h2>4. 可折叠区块</h2>
<details data-live="section-1">
  <summary>展开/折叠状态也会同步</summary>
  <p>这个 details 的 open 状态会同步给所有在线用户。</p>
</details>

<h2>5. 数据查询</h2>
<p class="hint">服务端保存为 JSON：<code>curl http://localhost:8787/state/demo</code>，可以让 Claude 直接读。</p>

<script src="../sync.js" data-room="demo"></script>
</body>
</html>
